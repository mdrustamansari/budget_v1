<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#e3f5ff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0a1322" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Budget Manager">
<title>Rustam's Budget Manager</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%2355a3f3'/%3E%3Cstop offset='1' stop-color='%231668f0'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='48' height='48' rx='13' fill='url(%23g)'/%3E%3Ccircle cx='24' cy='24' r='13' fill='none' stroke='%23e6f1ff' stroke-width='6' stroke-dasharray='38 81.7' transform='rotate(-90 24 24)'/%3E%3Ccircle cx='24' cy='24' r='13' fill='none' stroke='%23f6dc9b' stroke-width='6' stroke-dasharray='16 81.7' stroke-dashoffset='-44' transform='rotate(-90 24 24)'/%3E%3C/svg%3E">
<style>
    /* ===== Tokens: cool morning blue -> bright afternoon blue ===== */
    :root {
        color-scheme: light dark;
        --blue-a: #1fb8f5;            /* bright cyan */
        --blue-b: #1a64ff;            /* bright blue */
        --warning: #e0453f;
        --text-main: #0f1b2e;
        --text-muted: #566880;
        --glass: rgba(255, 255, 255, 0.50);
        --glass-hi: rgba(255, 255, 255, 0.74);
        --glass-line: rgba(255, 255, 255, 0.72);
        --sheen: rgba(255, 255, 255, 0.60);
        --hairline: rgba(15, 27, 46, 0.09);
        --track: rgba(15, 27, 46, 0.09);
        --input-bg: rgba(255, 255, 255, 0.60);
        --shadow: 0 10px 30px rgba(36, 84, 170, 0.14), 0 2px 6px rgba(36, 84, 170, 0.06);
        --base: #e3f5ff;
        --scrim: rgba(230, 246, 255, 0.42);
        --glass-blur: 20px;
        --on-accent: #fff;
        --on-shadow: 0 1px 2px rgba(0, 50, 130, 0.35);
        --ink-a: #0a85c7;
        --ink-b: #1250d6;
        --aur-1: rgba(40, 200, 255, 0.60);
        --aur-2: rgba(120, 170, 255, 0.34);
        --aur-3: rgba(30, 210, 250, 0.46);
        --aur-4: rgba(255, 225, 170, 0.38);
        --font-serif: "Times New Roman", Times, "Noto Serif", serif;
        --font-sans: Arial, Helvetica, Roboto, "Noto Sans", sans-serif;
        --font-thin: "Helvetica Neue", Arial, Roboto, "Noto Sans", sans-serif;
    }
    @media (prefers-color-scheme: dark) {
        :root {
            --blue-a: #3dcbff;
            --blue-b: #3b8bff;
            --ink-a: #59d4ff;
            --ink-b: #7db0ff;
            --warning: #ff6a64;
            --text-main: #eef4ff;
            --text-muted: #9db0cc;
            --glass: rgba(30, 42, 66, 0.46);
            --glass-hi: rgba(32, 46, 74, 0.80);
            --glass-line: rgba(255, 255, 255, 0.16);
            --sheen: rgba(255, 255, 255, 0.14);
            --hairline: rgba(255, 255, 255, 0.10);
            --track: rgba(255, 255, 255, 0.13);
            --input-bg: rgba(255, 255, 255, 0.08);
            --shadow: 0 10px 30px rgba(0, 0, 0, 0.42), 0 2px 6px rgba(0, 0, 0, 0.25);
            --base: #0a1322;
            --scrim: rgba(6, 12, 24, 0.50);
            --aur-1: rgba(30, 160, 255, 0.38);
            --aur-2: rgba(120, 90, 255, 0.22);
            --aur-3: rgba(20, 190, 240, 0.30);
            --aur-4: rgba(255, 170, 110, 0.10);
        }
    }

    /* ===== Themes (set on <html data-theme>): sky = morning, marigold = afternoon, dusk = evening, forest ===== */
    html[data-theme="marigold"] {
        --blue-a: #ffd60a; --blue-b: #ff8a00; --ink-a: #a87800; --ink-b: #c25400; --on-accent: #3a1c00; --on-shadow: none; --warning: #c9201f;
        --text-main: #2b1a08; --text-muted: #7a6248; --base: #fff6d6; --scrim: rgba(255, 247, 215, 0.45);
        --aur-1: rgba(255, 214, 10, 0.60); --aur-2: rgba(255, 150, 40, 0.32); --aur-3: rgba(255, 235, 90, 0.50); --aur-4: rgba(255, 175, 110, 0.38);
    }
    html[data-theme="dusk"] {
        --blue-a: #a58bff; --blue-b: #5b45e6; --ink-a: #6f55ee; --ink-b: #4a34c9; --on-accent: #fff; --on-shadow: 0 1px 2px rgba(40, 20, 120, 0.35);
        --text-main: #1a1535; --text-muted: #5d5880; --base: #efeafd; --scrim: rgba(244, 240, 255, 0.42);
        --aur-1: rgba(165, 139, 255, 0.55); --aur-2: rgba(255, 160, 190, 0.36); --aur-3: rgba(120, 150, 255, 0.40); --aur-4: rgba(255, 190, 150, 0.38);
    }
    html[data-theme="forest"] {
        --blue-a: #e3ea3b; --blue-b: #3db54a; --ink-a: #5a7d00; --ink-b: #1f7a2e; --on-accent: #11300b; --on-shadow: none; --warning: #d63a34;
        --text-main: #1a2b0b; --text-muted: #596a3c; --base: #f1f8d8; --scrim: rgba(243, 249, 222, 0.45);
        --aur-1: rgba(190, 225, 40, 0.55); --aur-2: rgba(120, 210, 90, 0.32); --aur-3: rgba(60, 200, 120, 0.34); --aur-4: rgba(255, 235, 110, 0.40);
    }
    @media (prefers-color-scheme: dark) {
        html[data-theme="marigold"] {
            --blue-a: #ffdd33; --blue-b: #ff9a1f; --ink-a: #ffe066; --ink-b: #ffa940; --on-accent: #2b1500; --warning: #ff5d57;
            --text-main: #fff3e0; --text-muted: #cdb594; --base: #1a1305; --scrim: rgba(26, 18, 4, 0.50);
            --aur-1: rgba(255, 200, 20, 0.30); --aur-2: rgba(255, 120, 30, 0.20); --aur-3: rgba(255, 220, 70, 0.20); --aur-4: rgba(255, 150, 90, 0.12);
        }
        html[data-theme="dusk"] {
            --blue-a: #a58bff; --blue-b: #6f5bff; --ink-a: #b9a6ff; --ink-b: #8f7dff; --on-accent: #fff;
            --text-main: #f1eeff; --text-muted: #aaa3cf; --base: #0f0b22; --scrim: rgba(12, 8, 28, 0.50);
            --aur-1: rgba(111, 91, 255, 0.40); --aur-2: rgba(255, 110, 170, 0.18); --aur-3: rgba(70, 110, 255, 0.25); --aur-4: rgba(255, 150, 110, 0.10);
        }
        html[data-theme="forest"] {
            --blue-a: #dff04a; --blue-b: #4ccb5a; --ink-a: #e2f26a; --ink-b: #7be58a; --on-accent: #0d2406; --warning: #ff6a64;
            --text-main: #f0f8dc; --text-muted: #b4c68f; --base: #0c1405; --scrim: rgba(10, 20, 4, 0.50);
            --aur-1: rgba(190, 225, 40, 0.28); --aur-2: rgba(80, 200, 80, 0.20); --aur-3: rgba(40, 190, 110, 0.20); --aur-4: rgba(240, 220, 90, 0.10);
        }
    }

    /* ===== Base: type is 30% smaller (root 70%) ===== */
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html { font-size: 70%; -webkit-text-size-adjust: 100%; background: var(--base); transition: background 0.3s; }
    body {
        font-family: var(--font-sans); font-weight: 400;
        background: transparent; color: var(--text-main);
        padding: 20px;
        padding-top: calc(20px + env(safe-area-inset-top));
        padding-bottom: calc(100px + env(safe-area-inset-bottom));
        max-width: 640px; margin: 0 auto;
        touch-action: manipulation;
        transition: color 0.3s;
    }
    body::before {
        content: ""; position: fixed; inset: -15%; z-index: -1; pointer-events: none;
        background:
            radial-gradient(42% 34% at 14% 8%, var(--aur-1), transparent 70%),
            radial-gradient(36% 30% at 92% 18%, var(--aur-2), transparent 70%),
            radial-gradient(46% 38% at 74% 92%, var(--aur-3), transparent 70%),
            radial-gradient(36% 30% at 8% 86%, var(--aur-4), transparent 70%);
        filter: blur(12px);
    }
    button, input, select { font: inherit; color: inherit; }

    /* ===== Glass surfaces ===== */
    .dashboard, .panel, .category-item, .history-card, .modal, .nav-bar {
        position: relative;
        background: linear-gradient(140deg, var(--sheen), transparent 40%), var(--glass);
        -webkit-backdrop-filter: blur(var(--glass-blur)) saturate(170%);
        backdrop-filter: blur(var(--glass-blur)) saturate(170%);
        border: 1px solid var(--glass-line);
        box-shadow: var(--shadow), inset 0 1px 0 var(--sheen);
    }
    @supports not ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) {
        .dashboard, .panel, .category-item, .history-card, .modal, .nav-bar { background: var(--glass-hi); }
    }

    /* ===== Typography ===== */
    .label { font-size: 0.88rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.6px; font-weight: 400; }
    .hint { font-size: 0.9rem; color: var(--text-muted); font-weight: 400; }
    .tap { cursor: pointer; }
    .flex-between { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
    .over { color: var(--warning) !important; }
    .title-serif { font-family: var(--font-serif); font-weight: 700; font-size: 1.7rem; letter-spacing: -0.2px; }
    .set-title { font-family: var(--font-serif); font-weight: 700; font-size: 1.25rem; margin-bottom: 10px; }
    .total-remaining { font-family: var(--font-thin); font-weight: 100; font-size: 2.6rem; letter-spacing: -0.5px; line-height: 1.05; margin-bottom: 4px; transition: color 0.3s; }

    /* ===== Header ===== */
    .app-header { display: flex; align-items: center; gap: 12px; margin-bottom: 18px; }
    .app-header svg { flex-shrink: 0; filter: drop-shadow(0 4px 10px color-mix(in srgb, var(--blue-b) 30%, transparent)); }
    .brand { font-family: var(--font-serif); font-weight: 700; font-size: 1.75rem; letter-spacing: -0.3px; line-height: 1.1; }
    .brand span { background: linear-gradient(90deg, var(--ink-a), var(--ink-b)); -webkit-background-clip: text; background-clip: text; color: transparent; }
    .brand-sub { font-size: 0.9rem; color: var(--text-muted); margin-top: 3px; letter-spacing: 0.5px; }

    /* ===== Top panel ===== */
    .panel { padding: 20px; border-radius: 26px; margin-bottom: 22px; }
    .dashboard { padding: 18px; border-radius: 22px; margin-bottom: 18px; }
    .panel-top { display: flex; justify-content: space-between; align-items: center; }
    .pill { font-size: 0.9rem; font-weight: 700; color: var(--ink-b); background: color-mix(in srgb, var(--blue-b) 14%, transparent); border: 1px solid color-mix(in srgb, var(--blue-b) 22%, transparent); padding: 4px 11px; border-radius: 14px; }
    .hero-row { display: flex; justify-content: space-between; align-items: center; margin-top: 12px; gap: 12px; }
    .ring { position: relative; width: 78px; height: 78px; flex-shrink: 0; }
    .ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
    .ring-track { stroke: var(--track); }
    .ring-arc { transition: stroke-dasharray 0.9s cubic-bezier(0.2, 0.8, 0.25, 1); }
    .ring-center { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
    .ring-pct { font-family: var(--font-serif); font-weight: 700; font-size: 1.3rem; line-height: 1; }
    .ring-cap { font-size: 0.8rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.6px; margin-top: 3px; }
    .pace { position: relative; margin-top: 18px; }
    .progress-container { width: 100%; height: 7px; background: var(--track); border-radius: 4px; overflow: hidden; }
    .progress-bar { height: 100%; border-radius: 4px; transition: width 0.3s; }
    .pace-tick { position: absolute; top: -4px; width: 2px; height: 15px; background: var(--text-main); opacity: 0.45; border-radius: 1px; transform: translateX(-1px); }
    .tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 16px; }
    .tile { border-radius: 16px; padding: 10px 11px; min-width: 0; border: 1px solid var(--glass-line); }
    .t-label { font-size: 0.82rem; text-transform: uppercase; letter-spacing: 0.6px; color: var(--text-muted); }
    .t-val { font-family: var(--font-serif); font-weight: 700; font-size: 1.3rem; margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .tile.t1 { background: linear-gradient(135deg, color-mix(in srgb, var(--blue-a) 28%, transparent), color-mix(in srgb, var(--blue-b) 12%, transparent)); }
    .tile.t2 { background: linear-gradient(135deg, color-mix(in srgb, var(--aur-3) 70%, transparent), color-mix(in srgb, var(--aur-1) 25%, transparent)); }
    .tile.t3 { background: linear-gradient(135deg, color-mix(in srgb, var(--aur-4) 80%, transparent), color-mix(in srgb, var(--aur-4) 25%, transparent)); }
    .tile.t3 .t-val { color: var(--text-muted); }
    .tile.t3.bad { background: linear-gradient(135deg, color-mix(in srgb, var(--warning) 26%, transparent), color-mix(in srgb, var(--warning) 10%, transparent)); }
    .tile.t3.bad .t-val { color: var(--warning); }
    .freq { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
    .fchip { font-family: var(--font-sans); display: flex; align-items: center; gap: 6px; font-size: 0.9rem; color: var(--text-muted); padding: 5px 11px; border-radius: 16px; background: var(--input-bg); border: 1px solid var(--glass-line); cursor: pointer; }
    .dot { width: 8px; height: 8px; border-radius: 50%; transition: background 0.3s; }

    /* ===== Lists ===== */
    .list-header { font-size: 0.95rem; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
    .list-header > span:first-child:not(.hint) { font-family: var(--font-serif); font-weight: 700; font-size: 1.45rem; }
    .undo-btn { background: var(--input-bg); border: 1px solid var(--glass-line); color: var(--text-muted); font-size: 0.9rem; padding: 5px 13px; border-radius: 15px; cursor: pointer; -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); }
    .undo-btn:disabled { opacity: 0.4; cursor: default; }
    .undo-btn:active:not(:disabled) { background: var(--track); }

    .category-item {
        --g1: var(--blue-a); --g2: var(--blue-b); --c: var(--blue-b); --glow: rgba(22, 104, 240, 0.35);
        display: grid; grid-template-columns: 1fr auto; column-gap: 12px; row-gap: 7px; align-items: center;
        padding: 14px 16px; border-radius: 20px; margin-bottom: 10px;
        transition: transform 0.2s;
        -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
    }
    .category-item:active { transform: scale(0.985); }
    .cat-meta { min-width: 0; }
    .cat-name { font-family: Arial, Helvetica, sans-serif; font-weight: 400; font-size: 1.15rem; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .cat-ico { display: inline-block; width: 1.5em; margin-right: 7px; text-align: center; font-size: 1.3rem; font-weight: 400; line-height: 1; vertical-align: -2px; font-family: "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", "Twemoji Mozilla", sans-serif; }
    .set-name { font-family: Arial, Helvetica, sans-serif; font-weight: 400; font-size: 1.1rem; }
    .fchip .cat-ico { width: auto; margin-right: 0; font-size: 1.05rem; vertical-align: -1px; }
    .cat-spent { font-family: var(--font-serif); font-weight: 700; font-size: 1.3rem; text-align: right; white-space: nowrap; transition: color 0.3s; }
    .cat-nums { font-size: 0.88rem; color: var(--text-muted); opacity: 0.8; }
    .cat-nums.over { opacity: 1; }
    .cat-bar { height: 5px; background: var(--track); border-radius: 3px; margin-top: 6px; overflow: hidden; }
    .cat-bar > div { height: 100%; border-radius: 3px; background: linear-gradient(90deg, var(--g1), var(--g2)); transition: width 0.3s; }
    .add-btn {
        justify-self: end; width: 38px; height: 38px; border-radius: 50%; border: none; cursor: pointer;
        display: flex; justify-content: center; align-items: center; padding-bottom: 3px;
        font-family: var(--font-sans); font-size: 2.1rem; font-weight: 400; line-height: 1; color: var(--on-accent); text-shadow: var(--on-shadow);
        background: linear-gradient(135deg, var(--g1), var(--g2));
        box-shadow: 0 5px 14px var(--glow), inset 0 1px 0 rgba(255, 255, 255, 0.45);
        transition: transform 0.15s, box-shadow 0.15s;
    }
    .add-btn:active { transform: scale(0.92); box-shadow: 0 2px 6px var(--glow), inset 0 1px 0 rgba(255, 255, 255, 0.35); }

    /* ===== Sections ===== */
    #history-section, #settings-section, #purch-section { display: none; }
    .empty-note { color: var(--text-muted); font-size: 1rem; padding: 6px 2px; }

    /* ===== History ===== */
    .history-card { border-radius: 20px; margin-bottom: 10px; overflow: hidden; box-shadow: var(--shadow), inset 0 1px 0 var(--sheen), inset 3px 0 0 var(--blue-b); }
    .history-card.bad { box-shadow: var(--shadow), inset 0 1px 0 var(--sheen), inset 3px 0 0 var(--warning); }
    .history-card summary { padding: 14px 16px; cursor: pointer; list-style: none; font-size: 1rem; }
    .history-card summary strong { font-family: var(--font-serif); font-size: 1.2rem; }
    .history-card summary::-webkit-details-marker { display: none; }
    .hist-detail { padding: 0 16px 12px; }
    .hist-row { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: 1rem; color: var(--text-muted); padding: 7px 0; border-top: 1px solid var(--hairline); }
    .hist-row:first-child { border-top: none; }
    .hist-row .rm { background: none; border: none; color: var(--text-muted); font-size: 1.5rem; padding: 0 8px; cursor: pointer; }

    /* ===== Settings ===== */
    .set-row { display: flex; justify-content: space-between; align-items: center; padding: 11px 0; border-top: 1px solid var(--hairline); cursor: pointer; gap: 10px; }
    .set-row:first-of-type { border-top: none; }
    .set-meta { font-size: 0.9rem; color: var(--text-muted); margin-top: 2px; }
    .btn-line { width: 100%; padding: 11px; border-radius: 16px; border: 1px solid var(--glass-line); background: var(--input-bg); color: var(--text-main); font-size: 1rem; font-weight: 700; cursor: pointer; margin-top: 8px; }
    .btn-line:active { background: var(--track); }
    .btn-accent { color: var(--on-accent); text-shadow: var(--on-shadow); border: none; background: linear-gradient(135deg, var(--blue-a), var(--blue-b)); box-shadow: 0 5px 14px color-mix(in srgb, var(--blue-b) 30%, transparent), inset 0 1px 0 rgba(255, 255, 255, 0.4); }
    .btn-accent:active { background: linear-gradient(135deg, var(--blue-a), var(--blue-b)); opacity: 0.85; }

    /* ===== Floating glass tab bar ===== */
    .nav-bar {
        position: fixed; left: 50%; transform: translateX(-50%);
        bottom: calc(12px + env(safe-area-inset-bottom));
        width: calc(100% - 32px); max-width: 420px;
        display: flex; gap: 4px; padding: 5px; border-radius: 28px; z-index: 5;
    }
    .nav-item { flex: 1; text-align: center; padding: 9px 0; white-space: nowrap; border-radius: 23px; font-size: 1rem; font-weight: 400; color: var(--text-muted); cursor: pointer; -webkit-user-select: none; user-select: none; transition: background 0.25s, color 0.25s; }
    .nav-item.active { color: var(--on-accent); text-shadow: var(--on-shadow); font-weight: 700; background: linear-gradient(135deg, var(--blue-a), var(--blue-b)); box-shadow: 0 4px 12px color-mix(in srgb, var(--blue-b) 35%, transparent), inset 0 1px 0 rgba(255, 255, 255, 0.4); }

    /* ===== Sheet (input / confirmation) ===== */
    .modal-backdrop { position: fixed; inset: 0; background: rgba(8, 16, 32, 0.34); -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); display: none; align-items: center; justify-content: center; padding: 20px; z-index: 20; }
    .modal-backdrop.show { display: flex; }
    .modal { width: 100%; max-width: 340px; max-height: 90vh; overflow-y: auto; padding: 22px; border-radius: 28px; background: linear-gradient(140deg, var(--sheen), transparent 40%), var(--glass-hi); }
    .modal h2 { font-family: var(--font-serif); font-weight: 700; font-size: 1.6rem; margin-bottom: 6px; }
    .modal p { font-size: 1rem; color: var(--text-muted); margin-bottom: 14px; line-height: 1.45; }
    .field { display: block; margin-bottom: 12px; }
    .field > span { display: block; font-size: 0.85rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.6px; margin-bottom: 5px; }
    .modal input, .modal select { width: 100%; font-size: 1.4rem; font-weight: 400; padding: 11px 14px; border-radius: 16px; border: 1px solid var(--glass-line); background: var(--input-bg); color: var(--text-main); outline: none; }
    .modal input[type="number"] { font-family: var(--font-thin); font-weight: 100; font-size: 2.2rem; letter-spacing: -0.3px; }
    .modal input:focus, .modal select:focus { border-color: var(--blue-b); box-shadow: 0 0 0 3px color-mix(in srgb, var(--blue-b) 22%, transparent); }
    .modal .error { color: var(--warning); font-size: 0.9rem; min-height: 1.2em; margin-bottom: 4px; }
    .modal-actions { display: flex; gap: 10px; margin-top: 10px; flex-wrap: wrap; }
    .modal-actions button { flex: 1; min-width: 90px; padding: 12px; border-radius: 18px; border: none; font-size: 1.1rem; font-weight: 700; cursor: pointer; }

    /* ===== Toast ===== */

    /* ===== Wallpaper backdrop (chosen once in Settings, shown blurred) ===== */

    .pinfo { background: var(--input-bg); color: var(--text-main); }

    .review-row button:active { background: var(--track); }

    /* ===== Opening moments ===== */
    #splash { position: fixed; inset: 0; z-index: 60; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; text-align: center; padding: 30px; background: var(--base); opacity: 0; visibility: hidden; pointer-events: none; transition: opacity 0.6s ease, visibility 0s linear 0.6s; overflow: hidden; }
    #splash::before { content: ""; position: absolute; inset: -15%; z-index: -1; filter: blur(12px);
        background: radial-gradient(42% 34% at 20% 15%, var(--aur-1), transparent 70%), radial-gradient(40% 32% at 85% 30%, var(--aur-2), transparent 70%), radial-gradient(46% 38% at 70% 90%, var(--aur-3), transparent 70%), radial-gradient(36% 30% at 10% 85%, var(--aur-4), transparent 70%); }
    #splash.show { opacity: 1; visibility: visible; pointer-events: auto; transition: opacity 0.35s ease; }

    #splash.show .s-logo { transform: none; opacity: 1; }
    #splash .s-hi { font-family: var(--font-serif); font-weight: 700; font-size: 2.3rem; letter-spacing: -0.3px; opacity: 0; transform: translateY(12px); transition: opacity 0.7s ease 0.3s, transform 0.7s ease 0.3s; }

    body.intro-run .panel, body.intro-run .daily-line, body.intro-run .list-header, body.intro-run .banner { animation: rise 0.7s cubic-bezier(0.2, 0.8, 0.25, 1) both; }

<script>
(function () {
    'use strict';

    /* ---------- Helpers ---------- */
    const MONTHS = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
    const DAY = 86400000;
    const fmt = n => Number(n).toLocaleString('en-IN', { maximumFractionDigits: 2 });
    const money = n => '₹' + fmt(n);
    const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    const $ = id => document.getElementById(id);
    const vibrate = p => { if (navigator.vibrate) navigator.vibrate(p); };
    const fmtDate = ts => new Date(ts).toLocaleString('en-IN', { day: 'numeric', month: 'short', hour: 'numeric', minute: '2-digit' });
    const fmtDay = ts => new Date(ts).toLocaleDateString('en-IN', { day: 'numeric', month: 'short' });
    const plural = (n, w) => `${n} ${w}${n === 1 ? '' : 's'}`;
    const prefersReduced = () => !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);

    function load(key) { try { return JSON.parse(localStorage.getItem(key)); } catch (e) { return null; } }
    function store(key, val) { try { localStorage.setItem(key, JSON.stringify(val)); } catch (e) {} }

    function toast(msg) {
        const t = $('toast');
        t.textContent = msg;
        t.classList.add('show');
        clearTimeout(toast._t);
        toast._t = setTimeout(() => t.classList.remove('show'), 2400);
    }

    /* ---------- Themes: three moods through the day, plus Forest ---------- */
    const THEMES = {
        sky:      { label: 'Sky',      part: 'Morning',   metaLight: '#e3f5ff', metaDark: '#0a1322' },
        marigold: { label: 'Marigold', part: 'Afternoon', metaLight: '#fff6d6', metaDark: '#1a1305' },
        dusk:     { label: 'Dusk',     part: 'Evening',   metaLight: '#efeafd', metaDark: '#0f0b22' },
        forest:   { label: 'Parrot',   part: '',          metaLight: '#f1f8d8', metaDark: '#0c1405' }
    };
    function currentThemeId() {
        if (meta && THEMES[meta.theme]) return meta.theme;
        const h = new Date().getHours();
        return h >= 5 && h < 12 ? 'sky' : (h >= 12 && h < 17 ? 'marigold' : 'dusk');
    }
    function applyTheme() {
        const id = currentThemeId();
        const root = document.documentElement;
        const changed = root.getAttribute('data-theme') !== id;
        root.setAttribute('data-theme', id);
        document.querySelectorAll('meta[name="theme-color"]').forEach(m => {
            m.setAttribute('content', (m.getAttribute('media') || '').indexOf('dark') >= 0 ? THEMES[id].metaDark : THEMES[id].metaLight);
        });
        return changed;
    }

    /* ---------- Passive awareness: accent colour drifting to red ---------- */
    function hex2rgb(h) {
        h = h.trim().replace('#', '');
        if (h.length === 3) h = h.split('').map(x => x + x).join('');
        const n = parseInt(h, 16);
        return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
    }
    function themeColors() {
        const cs = getComputedStyle(document.documentElement);
        const g = n => String(cs.getPropertyValue(n) || '').trim();
        const a = hex2rgb(g('--blue-a')), b = hex2rgb(g('--blue-b'));
        return {
            a, b,
            ia: /^#/.test(g('--ink-a')) ? hex2rgb(g('--ink-a')) : a,
            ib: /^#/.test(g('--ink-b')) ? hex2rgb(g('--ink-b')) : b,
            warn: hex2rgb(g('--warning'))
        };
    }
    const mixRGB = (x, y, t) => x.map((v, i) => Math.round(v + (y[i] - v) * t));
    // Accent gradient -> warning red as a limit nears (from 50% to 100%)
    function statusGrad(ratio) {
        const { a, b, ia, ib, warn } = themeColors();
        const t = Math.max(0, Math.min(1, (ratio - 0.5) / 0.5));
        const g1 = mixRGB(a, warn, t), g2 = mixRGB(b, warn, t);
        return { g1, g2, mid: mixRGB(g1, g2, 0.5), ink: mixRGB(mixRGB(ia, ib, 0.5), warn, t) };
    }
    const statusRGB = ratio => statusGrad(ratio).mid;
    const rgb = (c, a) => a === undefined ? `rgb(${c.join(',')})` : `rgba(${c.join(',')},${a})`;
    const catRatio = c => c.limit > 0 ? c.spent / c.limit : (c.spent > 0 ? 1 : 0);

    /* ---------- Data ---------- */
    const defaultCategories = [
        { id: 1,  name: "Milk",        limit: 500,  type: "fixed", price: 31 },
        { id: 2,  name: "Eggs",        limit: 500,  type: "fixed", price: 8.5 },
        { id: 3,  name: "Conveyance",  limit: 1500, type: "variable" },
        { id: 4,  name: "Non-Veg",     limit: 1500, type: "variable" },
        { id: 5,  name: "Vegetables",  limit: 1200, type: "variable" },
        { id: 6,  name: "Dry Fruits",  limit: 1000, type: "variable" },
        { id: 7,  name: "Wheat",       limit: 250,  type: "fixed", price: 200 },
        { id: 8,  name: "Rice",        limit: 200,  type: "fixed", price: 160 },
        { id: 9,  name: "Groceries",   limit: 2500, type: "variable" },
        { id: 10, name: "Gifts",       limit: 3000, type: "variable" },
        { id: 11, name: "Canteen",     limit: 600,  type: "variable" },
        { id: 12, name: "Misc",        limit: 250,  type: "variable" },
        { id: 13, name: "House Rent",  limit: 5500, type: "fixed", price: 5500 },
        { id: 14, name: "Electricity", limit: 700,  type: "variable" },
        { id: 15, name: "Grooming",    limit: 500,  type: "variable" },
        { id: 16, name: "Fragrances",  limit: 500,  type: "variable" },
        { id: 17, name: "Clothes",     limit: 1000, type: "variable" }
    ];
    const NEW_CATS_V2 = ["Grooming", "Fragrances", "Clothes"];

    // Recommended look: wallpaper blur 24, glass frosting 20
    const LOOK = { bgBlur: 24, glassBlur: 20 };
    const FLAGS = { introOn: true, greetOn: true, lineOn: true, paceOn: true, animOn: true, remindOn: true, purchOn: true };
    const META_DEFAULT = () => ({ lastBackup: null, ...LOOK, ...FLAGS, theme: 'auto', remindHour: 23, remindSnooze: null, catsV2: false });
    let state, history = [], meta = META_DEFAULT(), purch;
    let liveLedgerOpen = false;
    let lastTouched = null;      // category just used (drives the glide + glow)
    let hiddenAt = 0;

    // Category icons are emoji, so they keep their natural real-world colours
    const ICONS = [
        ['🥛', 'Milk'], ['🥚', 'Egg'], ['🍗', 'Chicken'], ['🥩', 'Meat'], ['🐟', 'Fish'],
        ['🥦', 'Vegetables'], ['🍎', 'Fruit'], ['🥜', 'Dry fruits'], ['🌾', 'Wheat'], ['🍚', 'Rice'],
        ['🍞', 'Bread'], ['🛒', 'Groceries'], ['🎁', 'Gifts'], ['🍽️', 'Meals'], ['☕', 'Tea & coffee'],
        ['🛺', 'Auto / travel'], ['🚌', 'Bus'], ['⛽', 'Fuel'], ['🏠', 'Home'], ['💡', 'Electricity'],
        ['💧', 'Water'], ['📱', 'Phone'], ['💊', 'Medicine'], ['📚', 'Books'], ['👕', 'Clothes'],
        ['💈', 'Grooming'], ['🌸', 'Fragrances'], ['👟', 'Shoes'], ['🧾', 'Misc']
    ];
    const ICON_RULES = [
        [/dry\s*fruit|nut/i, '🥜'], [/non[\s-]?veg|chicken|mutton|meat/i, '🍗'], [/fish/i, '🐟'], [/egg/i, '🥚'],
        [/milk|dairy/i, '🥛'], [/veg/i, '🥦'], [/fruit/i, '🍎'], [/wheat|atta|flour/i, '🌾'], [/rice/i, '🍚'],
        [/bread/i, '🍞'], [/grocer|kirana|ration/i, '🛒'], [/gift/i, '🎁'],
        [/canteen|food|meal|lunch|dinner|restaurant/i, '🍽️'], [/tea|coffee/i, '☕'],
        [/convey|transport|travel|bus|auto|commute|metro/i, '🛺'], [/fuel|petrol|diesel/i, '⛽'],
        [/rent|home|house/i, '🏠'], [/electric|power|bijli/i, '💡'], [/water/i, '💧'],
        [/phone|mobile|recharge|internet/i, '📱'], [/medic|health|pharma/i, '💊'],
        [/book|study|school|tuition/i, '📚'], [/shoe|sandal|footwear/i, '👟'], [/cloth|dress|shirt/i, '👕'],
        [/groom|barber|salon|haircut|shav/i, '💈'], [/fragran|perfume|attar|scent|deo/i, '🌸']
    ];
    function guessIcon(name) {
        const n = String(name || '');
        for (const [re, ic] of ICON_RULES) if (re.test(n)) return ic;
        return '🧾';
    }
    function iconOptions(cur) {
        const list = ICONS.slice();
        if (cur && !list.some(i => i[0] === cur)) list.unshift([cur, 'Current']);
        return list.map(([v, l]) => ({ v, l: `${v}  ${l}` }));
    }

    // Which spending counts as a big purchase, and each category's own monthly allowance (editable per category)
    function defaultPur(name) {
        const n = String(name || '');
        const P = (mode, thr, per, allow) => ({ mode, thr, per, allow });
        if (/rent|electric|power|bijli|milk|dairy|egg|veg|chicken|mutton|meat|fish|wheat|atta|flour|rice|grocer|kirana|ration|convey|transport|commute|bus|metro|auto/i.test(n) && !/dry\s*fruit/i.test(n)) return P('never', 0, 'month', 0);
        if (/canteen|meal|lunch|dinner|restaurant|food/i.test(n)) return P('above', 150, 'day', 0);
        if (/dry\s*fruit|nut/i.test(n)) return P('above', 1000, 'month', 0);
        if (/gift/i.test(n)) return P('above', 3000, 'month', 0);
        if (/fragran|perfume|attar|scent/i.test(n)) return P('always', 0, 'month', 500);
        if (/cloth|dress|shirt|shoe|footwear/i.test(n)) return P('always', 0, 'month', 1000);
        if (/groom|barber|salon/i.test(n)) return P('always', 0, 'month', 300);
        return P('always', 0, 'month', 500);
    }
    function normPur(p, name) {
        if (p && ['never', 'always', 'above'].indexOf(p.mode) >= 0) {
            const d = defaultPur(name);
            return { mode: p.mode, thr: Number(p.thr) || 0, per: p.per === 'day' ? 'day' : 'month', allow: p.mode === 'never' ? 0 : (Number(p.allow) >= 0 && p.allow !== undefined && p.allow !== null ? Number(p.allow) : d.allow) };
        }
        return defaultPur(name);
    }
    function purLabel(p) {
        if (p.mode === 'never') return 'not a big purchase';
        const base = p.mode === 'always' ? 'big purchase if over the minimum' : `counts above ${money(p.thr)} a ${p.per}`;
        return base + (p.allow > 0 ? ` · allowance ${money(p.allow)} a month` : ' · no waiting period');
    }

    function normCat(c) {
        return {
            id: c.id,
            name: String(c.name || 'Untitled'),
            icon: c.icon || guessIcon(c.name),
            limit: Number(c.limit) || 0,
            type: c.type === 'fixed' ? 'fixed' : 'variable',
            price: Number(c.price) || 0,
            spent: Number(c.spent) || 0,
            count: Number(c.count) || 0,
            pur: normPur(c.pur, c.name)
        };
    }
    function normState(s) {
        const now = new Date();
        const cats = (s.categories || []).map(normCat);
        const pool = Number(s.pool !== undefined ? s.pool : s.totalBudget);
        return {
            month: Number.isInteger(s.month) ? s.month : now.getMonth(),
            year: Number.isInteger(s.year) ? s.year : now.getFullYear(),
            pool: pool > 0 ? pool : 19200,
            bank: Number(s.bank) > 0 ? Number(s.bank) : null,
            needsPool: !!s.needsPool,
            categories: cats,
            tx: Array.isArray(s.tx) ? s.tx : [],
            nextId: Math.max(Number(s.nextId) || 0, ...cats.map(c => c.id), ...(Array.isArray(s.tx) ? s.tx.map(t => Number(t.id) || 0) : []), 0) + (Number(s.nextId) ? 0 : 1)
        };
    }
    function normHistory(h) {
        return (Array.isArray(h) ? h : []).map(e => ({
            month: e.month,
            year: e.year,
            pool: Number(e.pool || e.budget) || 19200,
            bank: Number(e.bank) > 0 ? Number(e.bank) : null,
            categories: (e.categories || e.data || []).map(normCat),
            tx: Array.isArray(e.tx) ? e.tx : [],
            closedAt: e.closedAt || null
        }));
    }
    function defaultState() {
        const now = new Date();
        return normState({
            month: now.getMonth(), year: now.getFullYear(), pool: 19200,
            categories: defaultCategories.map(c => ({ ...c, spent: 0, count: 0 })),
            tx: []
        });
    }

    /* ---------- Big purchases: a monthly pool plus a waiting period for each category ---------- */
    // 1) Monthly pool: a fixed amount arrives each calendar month; what is not used carries forward.
    //    A purchase bigger than what is left in the pool is not allowed this month.
    // 2) Category allowance: each category earns its own allowance day by day (carried forward too).
    //    Spending more than a category has earned starts a waiting period for that category only.
    function monthKey(d) { d = d || new Date(); return d.getFullYear() * 12 + d.getMonth(); }
    function defaultPurch() {
        return { cfg: { allowance: 3000, minAmt: 500 }, poolBal: 3000, poolKey: monthKey(), cats: {}, list: [], nextId: 1 };
    }
    function normPurch(p) {
        const d = defaultPurch();
        if (!p || typeof p !== 'object') return d;
        const cfg = p.cfg || {};
        const allowance = Number(cfg.allowance) > 0 ? Number(cfg.allowance) : d.cfg.allowance;
        const minAmt = Number(cfg.minAmt) > 0 ? Number(cfg.minAmt) : d.cfg.minAmt;
        const list = (Array.isArray(p.list) ? p.list : []).filter(x => x && isFinite(x.ts)).map(x => ({
            id: Number(x.id) || 0, ts: Number(x.ts), month: x.month, year: x.year, tx: x.tx, catId: x.catId,
            catName: String(x.catName || ''), icon: x.icon || '🧾', total: Number(x.total) || 0, amt: Number(x.amt) || 0,
            need: x.need === 'want' ? 'want' : 'need', reason: String(x.reason || ''), emergency: !!x.emergency,
            review: ['glad', 'unsure', 'regret'].indexOf(x.review) >= 0 ? x.review : null
        }));
        const cats = {};
        if (p.cats && typeof p.cats === 'object') Object.keys(p.cats).forEach(k => {
            const c = p.cats[k];
            if (c && isFinite(Number(c.bal)) && isFinite(Number(c.ts))) cats[k] = { bal: Number(c.bal), ts: Number(c.ts) };
        });
        const hasPool = p.poolKey !== undefined && p.poolKey !== null && isFinite(Number(p.poolBal));
        return {
            cfg: { allowance, minAmt },
            poolBal: hasPool ? Number(p.poolBal) : allowance,
            poolKey: hasPool ? Number(p.poolKey) : monthKey(),
            cats, list,
            nextId: Math.max(Number(p.nextId) || 1, ...list.map(x => x.id + 1), 1)
        };
    }
    const untilDate = days => fmtDay(Date.now() + days * DAY);

    // The monthly pool: add one allowance for every month that has started since it was last updated
    function rollPool() {
        const k = monthKey();
        if (purch.poolKey < k) { purch.poolBal += (k - purch.poolKey) * purch.cfg.allowance; purch.poolKey = k; }
    }
    function poolNow() { rollPool(); return purch.poolBal; }
    function poolOpensFor(price) {
        const pool = poolNow(), al = purch.cfg.allowance;
        const m = Math.max(1, Math.ceil((price - pool) / al - 1e-9));
        const d = new Date();
        return { m, ts: new Date(d.getFullYear(), d.getMonth() + m, 1).getTime(), bal: pool + m * al };
    }

    // Category allowance: earned continuously (allowance / 30 a day), never expires, and can go negative
    function catBucket(id) { return purch.cats[id] || (purch.cats[id] = { bal: 0, ts: Date.now() }); }
    const catRate = cat => (cat.pur.allow || 0) / 30;
    function catBalNow(cat) {
        const b = catBucket(cat.id);
        if (!(cat.pur.allow > 0)) return b.bal;
        return b.bal + Math.max(0, (Date.now() - b.ts) / DAY) * catRate(cat);
    }
    function settleCat(cat) { const b = catBucket(cat.id); b.bal = catBalNow(cat); b.ts = Date.now(); }
    const catCool = (cat, bal) => (cat.pur.allow > 0 && bal < 0 ? Math.ceil(-bal / catRate(cat) - 1e-9) : 0);
    const catWaiting = cat => (cat.pur.mode !== 'never' ? catCool(cat, catBalNow(cat)) : 0);
    const anyWaiting = () => state.categories.some(c => catWaiting(c) > 0) || poolNow() < 0;

    function applyPurchCfg(allowance, minAmt) {
        rollPool();
        purch.poolBal += allowance - purch.cfg.allowance;   // changing this month's allowance changes this month's pool
        purch.cfg.allowance = allowance;
        purch.cfg.minAmt = minAmt;
    }

    function dayTotal(catId, now) {
        const d = new Date(now); d.setHours(0, 0, 0, 0);
        const s = d.getTime();
        return state.tx.filter(t => t.cat === catId && t.kind === 'add' && t.ts >= s).reduce((a, t) => a + t.amt, 0);
    }
    // How much of this expense counts as a "big purchase" (0 = none)
    function countedFor(cat, amt) {
        const p = cat.pur || { mode: 'never' };
        let c = 0;
        if (p.mode === 'always') c = amt;
        else if (p.mode === 'above') {
            const prev = p.per === 'day' ? dayTotal(cat.id, Date.now()) : cat.spent;
            c = Math.max(0, prev + amt - Math.max(prev, p.thr || 0));
        }
        return c >= purch.cfg.minAmt ? c : 0;
    }
    function lastIn(cat) {
        return purch.list.filter(p => p.catId === cat.id).sort((a, b) => b.ts - a.ts)[0] || null;
    }
    function assess(cat, price) {
        const pool = poolNow();
        const bal = catBalNow(cat);
        const has = cat.pur.allow > 0;
        const cdNow = has ? catCool(cat, bal) : 0;
        const poolShort = price > pool + 1e-9;
        return { pool, poolShort, bal, has, cdNow, cdAfter: has ? catCool(cat, bal - price) : 0, last: lastIn(cat), blocked: poolShort || cdNow > 0 };
    }
    function assessHtml(cat, price) {
        const a = assess(cat, price);
        let h = '';
        if (a.poolShort) {
            const o = poolOpensFor(price);
            h += `<div class="pwarn">Not enough in this month's big-purchase pool: ${money(a.pool)} left, this needs ${money(price)}. The pool next has ${money(o.bal)} on ${fmtDay(o.ts)}.</div>`;
        } else h += `<div class="pok">Pool: ${money(a.pool)} left this month. After this: ${money(a.pool - price)}.</div>`;
        if (a.has) {
            if (a.cdNow > 0) h += `<div class="pwarn">${esc(cat.name)} is in a waiting period: ${plural(a.cdNow, 'more day')}, until ${untilDate(a.cdNow)}.</div>`;
            else if (a.cdAfter > 0) h += `<div class="pwarn">This starts a waiting period of ${plural(a.cdAfter, 'day')} for ${esc(cat.name)}, until ${untilDate(a.cdAfter)}. No new ${esc(cat.name.toLowerCase())} big purchase before then.</div>`;
            else h += `<div class="pok">${esc(cat.name)} has ${money(Math.max(0, a.bal))} earned. No waiting period needed.</div>`;
        }
        if (a.last) {
            const ago = Math.floor((Date.now() - a.last.ts) / DAY);
            h += `<div class="pinfo">Last in ${esc(cat.name)}: ${money(a.last.total)} on ${fmtDay(a.last.ts)} (${ago === 0 ? 'today' : plural(ago, 'day') + ' ago'}).</div>`;
        }
        return { html: h, a };
    }

    function saveAll() {
        store('budgetApp_state', state);
        store('budgetApp_history', history);
        store('budgetApp_meta', meta);
        store('budgetApp_purch', purch);
    }
    function totals(cats) {
        let spent = 0, over = 0, overCount = 0;
        cats.forEach(c => {
            spent += c.spent;
            if (c.spent > c.limit) { over += c.spent - c.limit; overCount++; }
        });
        return { spent, over, overCount };
    }

    /* ---------- Cyclical architecture: automatic monthly reset ---------- */
    function checkMonthReset() {
        const now = new Date();
        if (state.month === now.getMonth() && state.year === now.getFullYear()) return false;
        // Close the finished month into the permanent ledger
        history.push({
            month: state.month,
            year: state.year,
            pool: state.pool,
            bank: state.bank,
            categories: JSON.parse(JSON.stringify(state.categories)),
            tx: JSON.parse(JSON.stringify(state.tx)),
            closedAt: Date.now()
        });
        state.categories.forEach(c => { c.spent = 0; c.count = 0; });
        state.tx = [];
        state.month = now.getMonth();
        state.year = now.getFullYear();
        state.bank = null;
        state.needsPool = true; // bank balance and pool are entered by hand every month
        saveAll();
        return true;
    }

    /* ---------- Sheet (custom input / confirm dialog) ---------- */
    let sheet = { open: false, resolve: null };

    function openSheet(o) {
        return new Promise(resolve => {
            sheet = { open: true, resolve };
            const fields = o.fields || [];
            const fieldsHtml = fields.map(f => {
                let input;
                const val = f.value === undefined ? '' : f.value;
                if (f.type === 'select') {
                    input = `<select id="f-${f.key}">${f.options.map(op => `<option value="${esc(op.v)}"${op.v === f.value ? ' selected' : ''}>${esc(op.l)}</option>`).join('')}</select>`;
                } else if (f.type === 'number') {
                    input = `<input id="f-${f.key}" type="number" inputmode="decimal" step="any" min="0" value="${esc(val)}" placeholder="${esc(f.placeholder || '')}">`;
                } else if (f.type === 'textarea') {
                    input = `<textarea id="f-${f.key}" rows="3" maxlength="${f.max || 240}" placeholder="${esc(f.placeholder || '')}">${esc(val)}</textarea>`;
                } else if (f.type === 'check') {
                    return `<label class="field check" id="w-${f.key}"><input id="f-${f.key}" type="checkbox"${f.value ? ' checked' : ''}><span>${esc(f.label)}</span></label>`;
                } else {
                    input = `<input id="f-${f.key}" type="text" maxlength="${f.max || 30}" autocapitalize="words" value="${esc(val)}" placeholder="${esc(f.placeholder || '')}">`;
                }
                return `<label class="field" id="w-${f.key}"><span>${esc(f.label)}</span>${input}</label>`;
            }).join('');

            const m = $('sheet-modal');
            m.innerHTML = `
                <div class="modal">
                    <h2>${esc(o.title)}</h2>
                    ${o.sub ? `<p>${esc(o.sub)}</p>` : ''}
                    <div id="sheet-live"></div>
                    ${fieldsHtml}
                    <div class="error" id="sheet-error"></div>
                    <div class="modal-actions">
                        ${(o.mandatory || o.noCancel) ? '' : `<button class="btn-secondary" data-s="cancel">${esc(o.cancelText || 'Cancel')}</button>`}
                        <button class="${o.danger ? 'btn-danger' : 'btn-primary'}" data-s="ok">${esc(o.confirmText || 'Save')}</button>
                        ${o.extra ? `<button class="btn-extra" data-s="extra">${esc(o.extra)}</button>` : ''}
                    </div>
                </div>`;
            m.classList.add('show');

            const getVals = () => {
                const v = {};
                fields.forEach(f => {
                    const el = $('f-' + f.key);
                    v[f.key] = f.type === 'number' ? parseFloat(el.value)
                        : f.type === 'check' ? el.checked
                        : f.type === 'select' ? el.value : el.value.trim();
                });
                return v;
            };
            fields.forEach(f => {
                if (!f.showIf) return;
                const w = $('w-' + f.key), ctrl = $('f-' + f.showIf.key);
                const apply = () => { const on = f.showIf.not !== undefined ? ctrl.value !== f.showIf.not : ctrl.value === f.showIf.value; w.style.display = on ? '' : 'none'; };
                ctrl.addEventListener('change', apply);
                apply();
            });
            const refreshLive = () => {
                if (!o.live) return;
                const r = o.live(getVals()) || {};
                $('sheet-live').innerHTML = r.html || '';
                if (r.show) Object.keys(r.show).forEach(k => { const w = $('w-' + k); if (w) w.style.display = r.show[k] ? '' : 'none'; });
            };
            if (o.live) { m.oninput = refreshLive; m.onchange = refreshLive; refreshLive(); }

            const finish = result => {
                m.classList.remove('show');
                m.innerHTML = '';
                m.oninput = null; m.onchange = null;
                sheet = { open: false, resolve: null };
                resolve(result);
                setTimeout(promptPoolIfNeeded, 0);
            };
            m.onclick = e => {
                const act = e.target.dataset ? e.target.dataset.s : null;
                if (act === 'cancel') return finish(null);
                if (act === 'extra') return finish({ __extra: true });
                if (act === 'ok') {
                    const vals = getVals();
                    const err = o.validate ? o.validate(vals) : '';
                    if (err) { $('sheet-error').textContent = err; vibrate(40); return; }
                    return finish(fields.length ? vals : { ok: true });
                }
                if (e.target === m && !o.mandatory && !o.noCancel) finish(null);
            };
            m.onkeydown = e => {
                if (e.key === 'Enter' && e.target.tagName === 'INPUT' && e.target.type !== 'checkbox') {
                    e.preventDefault();
                    m.querySelector('[data-s="ok"]').click();
                }
            };
            if (!o.noFocus) {
                const first = m.querySelector('textarea, input:not([type="checkbox"])');
                if (first) setTimeout(() => { first.focus(); if (first.select) first.select(); }, 60);
            }
        });
    }

    /* ---------- Monthly pool + opening bank balance ---------- */
    const positive = key => v => (v[key] > 0 ? '' : 'Enter an amount greater than 0.');

    let poolPromptBusy = false;
    async function promptPoolIfNeeded() {
        if (!state || !state.needsPool || poolPromptBusy || sheet.open) return;
        poolPromptBusy = true;
        const last = history[history.length - 1];
        const lastLine = last ? `Last month you spent ${money(totals(last.categories).spent)} of ${money(last.pool)}. ` : '';
        const withPurch = meta.purchOn !== false;
        const fields = [
            { key: 'bank', label: 'Bank balance today (₹)', type: 'number', value: '', placeholder: 'Your opening balance' },
            { key: 'pool', label: 'Monthly pool (₹)', type: 'number', value: state.pool }
        ];
        if (withPurch) {
            fields.push({ key: 'allowance', label: 'Big-purchase allowance (₹)', type: 'number', value: purch.cfg.allowance });
            fields.push({ key: 'minAmt', label: 'Counts as big from (₹)', type: 'number', value: purch.cfg.minAmt });
        }
        const r = await openSheet({
            title: `New month · ${MONTHS[state.month]} ${state.year}`,
            sub: `${lastLine}Enter your bank balance, then this month's pool. The pool cannot be more than the bank balance.`,
            fields,
            confirmText: 'Start month',
            mandatory: true,
            validate: v => {
                if (!(v.bank > 0)) return 'Enter your bank balance at the start of the month.';
                if (!(v.pool > 0)) return 'Enter the monthly pool.';
                if (v.pool > v.bank) return `The pool cannot be more than your bank balance (${money(v.bank)}).`;
                if (withPurch && !(v.allowance > 0)) return 'Enter the big-purchase allowance.';
                if (withPurch && !(v.minAmt > 0)) return 'Enter the smallest amount that counts as a big purchase.';
                return '';
            }
        });
        poolPromptBusy = false;
        if (!r) return;
        state.bank = r.bank;
        state.pool = r.pool;
        state.needsPool = false;
        if (withPurch) applyPurchCfg(r.allowance, r.minAmt);
        saveAll();
        renderAll();
        toast(`Pool set to ${money(r.pool)}`);
    }

    async function editPool() {
        const r = await openSheet({
            title: 'Pool and bank balance',
            sub: 'The pool is what you may spend this month. It cannot be more than your opening bank balance.',
            fields: [
                { key: 'bank', label: 'Opening bank balance (₹)', type: 'number', value: state.bank || '', placeholder: 'Optional' },
                { key: 'pool', label: 'Monthly pool (₹)', type: 'number', value: state.pool }
            ],
            validate: v => {
                if (!(v.pool > 0)) return 'Enter an amount greater than 0.';
                if (!isNaN(v.bank) && v.bank > 0 && v.pool > v.bank) return `The pool cannot be more than your bank balance (${money(v.bank)}).`;
                return '';
            }
        });
        if (!r) return;
        state.pool = r.pool;
        state.bank = (!isNaN(r.bank) && r.bank > 0) ? r.bank : null;
        saveAll();
        renderAll();
        toast(`Pool set to ${money(r.pool)}`);
    }

    async function realityCheck() {
        if (!state.bank) { toast('Set your opening bank balance first (Edit pool).'); return; }
        const spent = totals(state.categories).spent;
        const expected = state.bank - spent;
        const r = await openSheet({
            title: 'Bank reality check',
            sub: `Opening balance ${money(state.bank)} minus ${money(spent)} logged = ${money(expected)} expected. Enter what your bank shows now.`,
            fields: [{ key: 'now', label: 'Bank balance now (₹)', type: 'number', value: '' }],
            confirmText: 'Compare',
            validate: v => (v.now >= 0 ? '' : 'Enter your current balance.')
        });
        if (!r) return;
        const diff = r.now - expected;
        const msg = Math.abs(diff) < 1 ? 'A perfect match. Your records and your bank agree.'
            : diff < 0 ? `Your bank shows ${money(-diff)} less than expected. About ${money(-diff)} of spending is probably not logged yet.`
            : `Your bank shows ${money(diff)} more than expected (money received, a refund, or a missed entry).`;
        await openSheet({ title: 'Result', sub: msg, confirmText: 'OK', noCancel: true });
    }

    /* ---------- Spending actions ---------- */
    function recordPurchase(cat, amt, info, txId) {
        rollPool();
        purch.poolBal -= info.counted;
        if (cat.pur.allow > 0) { settleCat(cat); catBucket(cat.id).bal -= info.counted; }
        const p = {
            id: purch.nextId++, ts: Date.now(), month: state.month, year: state.year, tx: txId, catId: cat.id,
            catName: cat.name, icon: cat.icon, total: amt, amt: info.counted, need: info.need,
            reason: info.reason, emergency: !!info.emergency, review: null
        };
        purch.list.push(p);
        if (purch.list.length > 400) purch.list.splice(0, purch.list.length - 400);
        return p;
    }
    function refundPurchase(purId) {
        const i = purch.list.findIndex(p => p.id === purId);
        if (i < 0) return;
        const p = purch.list[i];
        rollPool();
        purch.poolBal += p.amt;
        const cat = state.categories.find(c => c.id === p.catId);
        if (cat && cat.pur.allow > 0) { settleCat(cat); catBucket(cat.id).bal += p.amt; }
        purch.list.splice(i, 1);
    }

    function commit(cat, amt, kind, pinfo) {
        cat.spent += amt;
        if (kind === 'add') cat.count += 1;
        const txId = state.nextId++;
        const tx = { id: txId, cat: cat.id, name: cat.name, amt, ts: Date.now(), kind };
        if (pinfo) tx.pur = recordPurchase(cat, amt, pinfo, txId).id;
        state.tx.push(tx);
        lastTouched = cat.id;
        saveAll();
        renderAll();
    }

    async function bigPurchaseCheck(cat, amt, counted) {
        return openSheet({
            title: 'Big purchase',
            sub: `${cat.name} · ${money(amt)}${counted !== amt ? ` (${money(counted)} counts)` : ''}. Pause a moment and say why, honestly.`,
            fields: [
                { key: 'need', label: 'Need or want', type: 'select', value: 'need', options: [{ v: 'need', l: 'A real need' }, { v: 'want', l: 'A want' }] },
                { key: 'reason', label: 'Why now? Be honest', type: 'textarea', placeholder: 'e.g. my only pair of shoes has torn', value: '' },
                { key: 'emergency', label: 'This is a genuine emergency', type: 'check', value: false }
            ],
            live: () => {
                const { html, a } = assessHtml(cat, counted);
                return { html, show: { emergency: a.blocked } };
            },
            confirmText: 'Confirm purchase',
            cancelText: 'Not now',
            noFocus: true,
            validate: v => {
                if (!v.reason || v.reason.length < 15) return 'Write a real reason: at least a short sentence.';
                if (assess(cat, counted).blocked && !v.emergency) return 'This is not allowed right now. Tick emergency only if it truly is one, or choose Not now.';
                return '';
            }
        });
    }

    async function addExpense(id) {
        const cat = state.categories.find(c => c.id === id);
        if (!cat) return;
        let amt;

        if (cat.type === 'fixed') {
            amt = cat.price; // frictionless single tap
        } else {
            const r = await openSheet({
                title: `Add to ${cat.name}`,
                sub: `Spent ${money(cat.spent)} · Left ${money(cat.limit - cat.spent)}`,
                fields: [{ key: 'amt', label: 'Amount (₹)', type: 'number', value: '', placeholder: '0' }],
                confirmText: 'Add',
                validate: positive('amt')
            });
            if (!r) return;
            amt = r.amt;
        }

        // Active friction: haptic pause + confirmation
        if (cat.spent + amt > cat.limit) {
            vibrate([60, 40, 60]);
            const already = cat.spent >= cat.limit;
            const extraOver = already ? amt : cat.spent + amt - cat.limit;
            const poolAfter = state.pool - totals(state.categories).spent - amt;
            const msg = already
                ? `${cat.name} is already over its limit. This adds ${money(amt)} more overdrawn.`
                : `This puts ${cat.name} ${money(extraOver)} over its limit.`;
            const ok = await openSheet({
                title: 'Over budget',
                sub: `${msg} The overdrawn amount comes straight out of your monthly pool, leaving ${poolAfter < 0 ? '-' : ''}${money(Math.abs(poolAfter))}. Proceed?`,
                confirmText: 'Add anyway',
                danger: true
            });
            if (!ok) return;
        }

        // Big purchases ask for a reason and respect the waiting period
        let pinfo = null;
        const counted = meta.purchOn !== false ? countedFor(cat, amt) : 0;
        if (counted > 0) {
            vibrate([40, 30, 40]);
            pinfo = await bigPurchaseCheck(cat, amt, counted);
            if (!pinfo) return;
            pinfo.counted = counted;
        }

        commit(cat, amt, 'add', pinfo);
        toast(pinfo ? `+${money(amt)} · ${cat.name} · logged as a big purchase` : `+${money(amt)} · ${cat.name}`);
    }

    async function editSpent(id) {
        const cat = state.categories.find(c => c.id === id);
        if (!cat) return;
        const r = await openSheet({
            title: `Edit ${cat.name}`,
            sub: `Set the total spent this month (currently ${money(cat.spent)}).`,
            fields: [{ key: 'total', label: 'Total spent (₹)', type: 'number', value: cat.spent }],
            validate: v => (v.total >= 0 ? '' : 'Enter 0 or more.')
        });

        const diff = r.total - cat.spent;
        if (diff === 0) return;
        commit(cat, diff, 'adjust');
        toast(`${cat.name} set to ${money(r.total)}`);
    }

    function removeTx(txId) {
        const i = state.tx.findIndex(t => t.id === txId);
        if (i < 0) return;
        const t = state.tx[i];
        const cat = state.categories.find(c => c.id === t.cat);
        if (cat) {
            cat.spent = Math.max(0, cat.spent - t.amt);
            if (t.kind === 'add') cat.count = Math.max(0, cat.count - 1);
        }
        if (t.pur) refundPurchase(t.pur);
        state.tx.splice(i, 1);
        saveAll();
        renderAll();
        toast(`Removed ${money(Math.abs(t.amt))} · ${t.name}`);
    }
    const undoLast = () => { if (state.tx.length) removeTx(state.tx[state.tx.length - 1].id); };

                if (!(v.limit >= 0)) return 'Enter a monthly limit.';

                if (v.type === 'fixed' && !(v.price > 0)) return 'Enter the amount per tap.';
                if (v.pm === 'above' && !(v.thr > 0)) return 'Enter the limit before spending counts.';

            }

            const ok = await openSheet({
                title: `Delete ${cat.name}?`,

            state.tx = state.tx.filter(t => t.cat !== cat.id);

            const newPur = { mode: r.pm, thr: r.pm === 'above' ? r.thr : 0, per: r.per, allow: r.pm === 'never' || isNaN(r.allow) ? 0 : r.allow };
            if (cat) {
                settleCat(cat);                                  // bank what was earned at the old allowance first
                cat.name = r.name; cat.icon = r.icon; cat.type = r.type; cat.limit = r.limit;
                cat.price = r.type === 'fixed' ? r.price : cat.price;

                const nc = { id: state.nextId++, name: r.name, icon: r.icon, type: r.type, limit: r.limit, price: r.type === 'fixed' ? r.price : 0, spent: 0, count: 0, pur: newPur };
                state.categories.push(nc);
                catBucket(nc.id);
            }
        }
        saveAll();
        renderAll();
    }

    /* ---------- Data sovereignty: backup & restore ---------- */
    function backupPayload() {
        return { app: 'minimal-budget', version: 3, exportedAt: new Date().toISOString(), state, history, purch };
    }
    function backupBase() {
        const d = new Date();
        return `budget-backup-${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
    }
    function markBackedUp() {
        meta.lastBackup = Date.now();
        meta.remindSnooze = null;
        saveAll();
        renderSettings();
        renderBanner();
    }
    function exportBackup() {
        const blob = new Blob([JSON.stringify(backupPayload(), null, 2)], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = backupBase() + '.json';
        document.body.appendChild(a);
        a.click();
        a.remove();
        setTimeout(() => URL.revokeObjectURL(url), 3000);
        markBackedUp();
        toast('Backup saved to your downloads');
    }
    // Opens the phone's share sheet with the backup file attached; pick Google Drive or Proton Drive there
    async function shareBackup() {
        const json = JSON.stringify(backupPayload(), null, 2);
        // plain-text files are accepted by every phone's share sheet; .json is tried second
        const tries = [[backupBase() + '.txt', 'text/plain'], [backupBase() + '.json', 'application/json']];
        let why = 'this browser cannot share files';
        if (navigator.share && typeof File === 'function') {
            for (const [name, type] of tries) {
                let file;
                try { file = new File([json], name, { type }); } catch (e) { continue; }
                try {
                    if (navigator.canShare && !navigator.canShare({ files: [file] })) { why = 'the phone would not accept the file'; continue; }
                } catch (e) {}
                try {
                    await navigator.share({ files: [file], title: "Rustam's Budget Manager backup" });
                    markBackedUp();
                    toast('Backup shared');
                    return;
                } catch (e) {
                    if (e && e.name === 'AbortError') return;      // you closed the sheet
                    why = (e && e.name) || 'an error';
                }
            }
        }
        exportBackup();
        toast(`The share sheet could not open (${why}). A copy was saved to Downloads; upload it from your Files app.`);
    }

    function importBackup(file) {
        const reader = new FileReader();
        reader.onload = async () => {
            let data;
            try { data = JSON.parse(reader.result); } catch (e) { data = null; }
            if (!data || data.app !== 'minimal-budget' || !data.state || !Array.isArray(data.state.categories)) {
                toast('That file is not a valid backup');
                return;
            }
            const when = data.exportedAt ? new Date(data.exportedAt).toLocaleDateString('en-IN', { day: 'numeric', month: 'short', year: 'numeric' }) : 'unknown date';
            const ok = await openSheet({
                title: 'Restore backup?',
                sub: `This replaces everything in the app now with the backup from ${when}.`,
                confirmText: 'Restore',
                danger: true
            });
            if (!ok) return;
            state = normState(data.state);
            history = normHistory(data.history);
            if (data.purch) purch = normPurch(data.purch);
            checkMonthReset();
            saveAll();
            renderAll();
            toast('Backup restored');
            promptPoolIfNeeded();
        };
        reader.readAsText(file);
    }

    /* ---------- Wallpaper backdrop ---------- */
    // A web page cannot read the phone's wallpaper by itself, so the user picks it once.
    // It is shrunk (it is shown blurred anyway) and kept only on this device.
    function getBg() { try { return localStorage.getItem('budgetApp_bg'); } catch (e) { return null; } }

    function applyBackground() {
        const data = getBg();
        const el = $('bg-layer');
        if (data) {
            el.style.backgroundImage = `url("${data}")`;
            el.style.filter = `blur(${meta.bgBlur}px) saturate(1.2)`;
            document.documentElement.classList.add('has-bg');
        } else {
            el.style.backgroundImage = '';
            document.documentElement.classList.remove('has-bg');
        }
    }

    function processWallpaper(file) {
        const url = URL.createObjectURL(file);
        const img = new Image();
        img.onload = () => {
            let saved = false;
            for (const [max, q] of [[720, 0.75], [480, 0.65]]) {
                const sc = Math.min(1, max / Math.max(img.width, img.height));
                const c = document.createElement('canvas');
                c.width = Math.max(1, Math.round(img.width * sc));
                c.height = Math.max(1, Math.round(img.height * sc));
                c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
                try { localStorage.setItem('budgetApp_bg', c.toDataURL('image/jpeg', q)); saved = true; break; } catch (e) {}
            }
            URL.revokeObjectURL(url);
            if (saved) { applyBackground(); renderSettings(); toast('Background set'); }
            else toast('Could not save that photo');
        };
        img.onerror = () => { URL.revokeObjectURL(url); toast('Could not read that image'); };
        img.src = url;
    }

    function clearBackground() {
        try { localStorage.removeItem('budgetApp_bg'); } catch (e) {}
        applyBackground();
        renderSettings();
        toast('Default sky restored');
    }

    let lineBump = 0;
    function elapsedDays() {
        const now = new Date();
        return (now.getDate() - 1) + (now.getHours() * 60 + now.getMinutes()) / 1440;
    }
    function lineContext() {
        const { spent, over } = totals(state.categories);
        const ratio = state.pool > 0 ? spent / state.pool : 1;
        const dim = new Date(new Date().getFullYear(), new Date().getMonth() + 1, 0).getDate();
        const frac = elapsedDays() / dim;
        const late = elapsedDays() >= 3;
        if (over > 0 || (late && ratio > frac + 0.12)) return 'restrain';
        if (meta.purchOn !== false && anyWaiting()) return 'cool';
        if (late && ratio < frac - 0.05) return 'cheer';
        return 'general';
    }
    function pickLine() {
        const now = new Date();
        const doy = Math.floor((now - new Date(now.getFullYear(), 0, 0)) / DAY);
        const n = doy + lineBump;
        let ctx = lineContext();
        if (ctx === 'general' && n % 3 === 2) ctx = 'tips';
        const pool = LINES[ctx];
        return pool[((n % pool.length) + pool.length) % pool.length];
    }
    function greeting() {
        const h = new Date().getHours();
        return (h < 12 ? 'Good morning' : h < 17 ? 'Good afternoon' : 'Good evening') + ', Rustam';
    }
    function dailyPerDay() {
        const now = new Date();
        const dim = new Date(now.getFullYear(), now.getMonth() + 1, 0).getDate();
        const rem = state.pool - totals(state.categories).spent;
        return rem > 0 ? Math.floor(rem / (dim - now.getDate() + 1)) : 0;
    }
    function statusSentence() {
        const rem = state.pool - totals(state.categories).spent;
        return `${rem < 0 ? '-' : ''}${money(Math.abs(rem))} left this month · ${money(dailyPerDay())} a day`;
    }
    function paceSentence() {
        const now = new Date();
        const dim = new Date(now.getFullYear(), now.getMonth() + 1, 0).getDate();
        const d = elapsedDays();
        if (d < 3) return 'Early in the month: the pace estimate appears after day 3.';
        // lump-sum items (rent, a month's wheat) are paid once, so only the rest is scaled up
        let lump = 0, rest = 0;
        state.categories.forEach(c => { if (c.type === 'fixed' && c.limit > 0 && c.price >= 0.5 * c.limit) lump += c.spent; else rest += c.spent; });
        const projected = lump + rest / d * dim;
        const diff = state.pool - projected;
        const r = Math.round(Math.abs(diff) / 10) * 10;
        return diff >= 0 ? `At this pace you'll finish with about ${money(r)} to spare.` : `At this pace you'll overshoot the pool by about ${money(r)}.`;
    }

    /* ---------- Opening moments ---------- */
    function startEnter() {
        if (meta.introOn === false || prefersReduced()) return;
        document.body.classList.add('intro-run');
        clearTimeout(startEnter._t);
        startEnter._t = setTimeout(() => document.body.classList.remove('intro-run'), 2400);
        // the figure counts up and the ring fills as the dashboard appears
        countUp($('overall-remaining'), state.pool - totals(state.categories).spent, 1100);
        const arc = $('ring-arc');
        const target = arc.getAttribute('stroke-dasharray');
        arc.style.transition = 'none';
        arc.setAttribute('stroke-dasharray', '0 226.2');
        void arc.getBoundingClientRect();
        arc.style.transition = '';
        requestAnimationFrame(() => arc.setAttribute('stroke-dasharray', target));
    }
    function showSplash() {
        const s = $('splash');
        if (meta.introOn === false || prefersReduced()) return;
        $('s-hi').textContent = meta.greetOn === false ? "Rustam's Budget Manager" : greeting();
        $('s-sub').textContent = statusSentence();
        s.classList.add('show');
        const close = () => { clearTimeout(showSplash._t); s.classList.remove('show'); startEnter(); };
        s.onclick = close;
        clearTimeout(showSplash._t);
        showSplash._t = setTimeout(close, 2900);
    }
    function countUp(el, to, ms) {
        const t0 = performance.now();
        const tok = el._cu = {};
        const final = (to < 0 ? '-' : '') + money(Math.abs(to));
        const step = now => {
            if (el._cu !== tok) return;
            const k = Math.min(1, (now - t0) / ms);
            const v = Math.round(Math.abs(to) * (1 - Math.pow(1 - k, 3)));
            el.textContent = k < 1 ? (to < 0 ? '-' : '') + money(v) : final;
            if (k < 1) requestAnimationFrame(step);
        };
        requestAnimationFrame(step);
    }

    /* ---------- Rendering ---------- */
    function renderBanner() {
        const el = $('backup-banner');
        const now = new Date(), h = now.getHours();
        const hr = Number.isFinite(meta.remindHour) ? meta.remindHour : 23;
        const due = meta.remindOn !== false && (h >= hr || h < 4)
            && !(meta.lastBackup && Date.now() - meta.lastBackup < 18 * 3600 * 1000)
            && !(meta.remindSnooze && Date.now() < meta.remindSnooze);
        el.innerHTML = due
            ? `<span>🌙 It's late. Back up today's entries?</span><span class="b-act"><button data-b="later">Later</button><button class="on" data-b="now">Back up</button></span>`
            : '';
    }

    function renderDashboard() {
        const { spent, over } = totals(state.categories);
        const remaining = state.pool - spent;
        const ratio = state.pool > 0 ? spent / state.pool : 1;
        const sg = statusGrad(ratio);
        const pct = Math.max(0, Math.min(ratio * 100, 100));

        const now = new Date();
        const dim = new Date(now.getFullYear(), now.getMonth() + 1, 0).getDate();
        const daysLeft = dim - now.getDate() + 1;
        const elapsed = ((now.getDate() - 1) + (now.getHours() * 60 + now.getMinutes()) / 1440) / dim * 100;

        $('month-sub').textContent = (meta.greetOn !== false ? greeting() + ' · ' : '') + `${MONTHS[state.month]} ${state.year}`;
        $('pool-label').textContent = `Pool ${money(state.pool)}`;
        $('days-pill').textContent = `${daysLeft} day${daysLeft === 1 ? '' : 's'} left`;

        const remEl = $('overall-remaining');
        remEl._cu = null;
        remEl.textContent = (remaining < 0 ? '-' : '') + money(Math.abs(remaining));
        remEl.style.color = (ratio > 0.5 || remaining < 0) ? rgb(sg.ink) : '';

        // Progress bar with a "today" tick: is the spending ahead of the calendar?
        const bar = $('overall-progress');
        bar.style.width = pct + '%';
        bar.style.background = `linear-gradient(90deg, ${rgb(sg.g1)}, ${rgb(sg.g2)})`;
        $('pace-tick').style.left = elapsed + '%';
        $('pace-day').textContent = `Day ${now.getDate()} of ${dim}`;
        const pn = $('pace-note');
        pn.style.display = meta.paceOn === false ? 'none' : '';
        pn.textContent = paceSentence();

        // Ring: share of the pool used
        const C = 2 * Math.PI * 36;
        const arc = $('ring-arc');
        arc.setAttribute('stroke-dasharray', `${(pct / 100) * C} ${C}`);
        $('ring-g1').setAttribute('stop-color', rgb(sg.g1));
        $('ring-g2').setAttribute('stop-color', rgb(sg.g2));
        arc.setAttribute('stroke-linecap', pct > 0 ? 'round' : 'butt');
        $('ring-pct').textContent = Math.round(pct) + '%';

        // Tiles: what a person actually watches
        $('tile-spent').textContent = money(spent);
        $('tile-day').textContent = remaining > 0 ? money(Math.floor(remaining / daysLeft)) : '₹0';
        $('tile-over').textContent = money(over);
        $('tile-over-box').classList.toggle('bad', over > 0);

        const sorted = [...state.categories].sort((a, b) => b.count - a.count || a.id - b.id);

        $('top-dots').innerHTML = sorted.slice(0, 3).map(cat =>
            `<div class="fchip" data-id="${cat.id}"><span class="dot" style="background:${rgb(statusRGB(catRatio(cat)))}"></span><span class="cat-ico">${cat.icon}</span>${esc(cat.name)}</div>`
        ).join('');

        // Big-purchase status chip
        const pc = $('purch-chip');
        if (meta.purchOn === false) pc.style.display = 'none';
        else {
            const pool = poolNow(), waiting = state.categories.filter(c => catWaiting(c) > 0).length;
            const used = pool < purch.cfg.minAmt;
            pc.style.display = '';
            pc.classList.toggle('bad', used);
            pc.textContent = (used ? '🛍️ Big purchases · pool used up this month' : `🛍️ Big purchases · ${money(pool)} left this month`) + (waiting ? ` · ${waiting} waiting` : '');
        }

        // Daily line
        const dl = $('daily-line');
        if (meta.lineOn === false) dl.style.display = 'none';
        else {
            const [text, kind] = pickLine();
            dl.style.display = '';
            dl.innerHTML = `<span class="q">“</span><span class="t">${esc(text)}<span class="k">${esc(kind)} · tap for another</span></span>`;
        }

        renderBanner();

        const last = state.tx[state.tx.length - 1];
        $('undo-btn').disabled = !last;
        $('last-action').textContent = last ? `Last: ${last.amt < 0 ? '-' : ''}${money(Math.abs(last.amt))} · ${last.name}` : ' ';

        // Category list, with a slow glide when the order changes
        const listEl = $('category-list');
        const animate = meta.animOn !== false && !prefersReduced();
        const before = {};
        if (animate) listEl.querySelectorAll('.category-item').forEach(el => { before[el.dataset.id] = el.getBoundingClientRect().top; });

        listEl.innerHTML = sorted.map((cat, idx) => {
            const left = cat.limit - cat.spent;
            const isOver = left < 0;
            const r = catRatio(cat);
            const sgc = statusGrad(r);
            const barPct = Math.min(r * 100, 100);
            return `
            <div class="category-item" data-id="${cat.id}" style="--i:${Math.min(idx, 9)};--g1:${rgb(sgc.g1)};--g2:${rgb(sgc.g2)};--c:${rgb(sgc.ink)};--glow:${rgb(sgc.g2, 0.38)}">
                <div class="cat-name ${isOver ? 'over' : ''}"><span class="cat-ico">${cat.icon}</span>${esc(cat.name)}${isOver ? ' ⚠️' : ''}</div>
                <div class="cat-spent ${isOver ? 'over' : ''}"${!isOver && r > 0.5 ? ' style="color:var(--c)"' : ''}>${money(cat.spent)}</div>
                <div class="cat-meta">
                    <div class="cat-nums ${isOver ? 'over' : ''}">${isOver ? '-' : ''}${fmt(Math.abs(left))} / ${fmt(cat.limit)}</div>
                    <div class="cat-bar"><div style="width:${barPct}%"></div></div>
                </div>
                <button class="add-btn" data-id="${cat.id}" aria-label="Add expense to ${esc(cat.name)}">+</button>
            </div>`;
        }).join('') || '<div class="empty-note">No categories yet. Add some in Settings.</div>';

        if (animate && Object.keys(before).length) {
            listEl.querySelectorAll('.category-item').forEach(el => {
                const id = el.dataset.id;
                if (before[id] === undefined) return;
                const newTop = el.getBoundingClientRect().top;
                const dy = before[id] - newTop;
                const tapped = String(lastTouched) === id;
                if (Math.abs(dy) > 1 && el.animate) {
                    const dur = Math.min(1500, 700 + Math.abs(dy) * 0.4);
                    if (tapped) el.style.zIndex = '3';
                    const a = el.animate([{ transform: `translateY(${dy}px)` }, { transform: 'translateY(0)' }], { duration: dur, easing: 'cubic-bezier(0.22, 0.8, 0.24, 1)' });
                    a.onfinish = a.oncancel = () => { el.style.zIndex = ''; };
                    // keep the moving card in view if it travels above the screen
                    if (tapped && newTop < 60 && window.scrollTo) window.scrollTo({ top: Math.max(0, window.scrollY + newTop - 90), behavior: 'smooth' });
                }
                if (tapped) el.classList.add('flash');
            });
        } else if (lastTouched !== null) {
            const el = listEl.querySelector(`.category-item[data-id="${lastTouched}"]`);
            if (el && animate) el.classList.add('flash');
        }
        lastTouched = null;
    }

    function pItemHtml(p) {
        const rv = { glad: '🙂 glad', unsure: '😐 unsure', regret: '😕 regret' }[p.review] || '';
        return `
        <div class="pitem">
