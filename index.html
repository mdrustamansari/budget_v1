            <div class="set-meta">${fmtDay(p.ts)} · ${p.need === 'need' ? 'Need' : 'Want'}${p.emergency ? ' · emergency override' : ''}${p.amt !== p.total ? ` · ${money(p.amt)} counted` : ''}${rv ? ' · ' + rv : ''}</div>
            <div class="p-reason">“${esc(p.reason)}”</div>
        </div>`;
    }

    function renderPurchases() {
        const el = $('purch-section');
        if (meta.purchOn === false) { el.innerHTML = ''; return; }
        const pool = poolNow(), al = purch.cfg.allowance;
        const monthList = purch.list.filter(p => p.month === state.month && p.year === state.year);
        const used = monthList.reduce((sum, p) => sum + p.amt, 0);
        const carried = Math.max(0, pool + used - al);
        const pct = Math.max(0, Math.min(100, pool / Math.max(al + carried, 1) * 100));
        const sg = statusGrad(1 - pct / 100);

        let html = `
        <div class="dashboard">
            <div class="title-serif">Big purchases</div>
            <div class="total-remaining${pool < 0 ? ' over' : ''}" style="margin-top:10px;">${pool < 0 ? '-' : ''}${money(Math.abs(pool))}</div>
            <div class="hint">${pool < 0 ? 'overspent: next month repays it first' : "left in this month's pool"}</div>
            <div class="progress-container" style="margin-top:14px;"><div class="progress-bar" style="width:${pct}%;background:linear-gradient(90deg, ${rgb(sg.g1)}, ${rgb(sg.g2)})"></div></div>
            <p class="hint" style="margin-top:8px;">${money(al)} a month${carried > 0.5 ? ` + ${money(carried)} carried over` : ''} · ${money(used)} used this month · counts spending of ${money(purch.cfg.minAmt)} or more. What you do not use carries forward.</p>
            <button class="btn-line btn-accent" data-act="can-buy">Can I buy this?</button>
            <button class="btn-line" data-act="purch-cfg">Pool and minimum</button>
        </div>`;

        const catRows = state.categories.filter(c => c.pur.mode !== 'never').map(c => {
            const bal = catBalNow(c), cd = catCool(c, bal), has = c.pur.allow > 0;
            return `<div class="set-row" data-act="edit-cat" data-id="${c.id}">
                <div><div class="set-name"><span class="cat-ico">${c.icon}</span>${esc(c.name)}</div><div class="set-meta">${has ? `${money(c.pur.allow)} a month, earned daily` : 'No waiting period'}</div></div>
                <div class="cd${cd > 0 ? ' over' : ''}">${cd > 0 ? `Waiting ${plural(cd, 'day')}<span>until ${untilDate(cd)}</span>` : has ? `Ready<span>${money(Math.floor(Math.max(0, bal)))} earned</span>` : ''}</div>
            </div>`;
        }).join('');
        html += `<div class="dashboard"><div class="set-title">Waiting period by category</div>${catRows || '<div class="empty-note">No category counts as a big purchase.</div>'}</div>`;

        const due = purch.list.filter(p => !p.review && Date.now() - p.ts >= 30 * DAY).slice(0, 3);
        if (due.length) {
            html += `<div class="dashboard"><div class="set-title">Still glad you bought it?</div>` + due.map(p => `
                <div class="pitem">
                    <div class="pi-top"><span class="set-name"><span class="cat-ico">${p.icon}</span>${esc(p.catName)}</span><b>${money(p.total)}</b></div>
                    <div class="set-meta">${fmtDay(p.ts)}</div>
                    <div class="p-reason">“${esc(p.reason)}”</div>
                    <div class="review-row"><button data-review="glad" data-pid="${p.id}">🙂 Glad</button><button data-review="unsure" data-pid="${p.id}">😐 Unsure</button><button data-review="regret" data-pid="${p.id}">😕 Regret</button></div>
                </div>`).join('') + `</div>`;
        }

        const sorted = [...purch.list].sort((a, b) => b.ts - a.ts);
        const thisMonth = sorted.filter(p => p.month === state.month && p.year === state.year);
        const earlier = sorted.filter(p => !(p.month === state.month && p.year === state.year));
        html += `<div class="dashboard"><div class="set-title">${MONTHS[state.month]} ${state.year} (this month)</div>${
            thisMonth.length ? thisMonth.map(pItemHtml).join('') : '<div class="empty-note">No big purchases yet this month.</div>'}</div>`;

        const groups = {};
        earlier.forEach(p => { const k = `${p.year}-${String(p.month).padStart(2, '0')}`; (groups[k] = groups[k] || []).push(p); });
        Object.keys(groups).sort().reverse().forEach(k => {
            const g = groups[k];
            html += `<details class="history-card"><summary><strong>${MONTHS[g[0].month]} ${g[0].year}</strong><br><span>${plural(g.length, 'big purchase')} · ${money(g.reduce((sum, p) => sum + p.total, 0))}</span></summary><div class="hist-detail">${g.map(pItemHtml).join('')}</div></details>`;
        });

        el.innerHTML = html;
    }

    function renderHistory() {
        const el = $('history-section');
        const past = [...history].reverse();
        const avg = past.length ? past.reduce((s, h) => s + totals(h.categories).spent, 0) / past.length : 0;
        const bk = meta.lastBackup ? `Last backup: ${new Date(meta.lastBackup).toLocaleDateString('en-IN', { day: 'numeric', month: 'short', year: 'numeric' })}` : 'No backup yet. Back one up from Settings.';

        let html = `
        <div class="dashboard">
            <div class="title-serif">Reports &amp; History</div>
            <p class="label" style="margin-top:10px;">${past.length ? `${past.length} closed month${past.length === 1 ? '' : 's'} · average spend ${money(avg)}` : 'Closed months are saved here automatically.'}</p>
            <p class="hint" style="margin-top:8px;">${bk}</p>
        </div>`;

        // Live month ledger (editable)
        const { spent, over } = totals(state.categories);
        const live = [...state.tx].reverse().slice(0, 60);
        html += `
        <details class="history-card" id="live-ledger" ${liveLedgerOpen ? 'open' : ''}>
            <summary>
                <strong>${MONTHS[state.month]} ${state.year} (this month)</strong><br>
                <span>Spent: ${money(spent)} / ${money(state.pool)}${over > 0 ? ` · <span class="over">${money(over)} overdrawn</span>` : ''}</span>
                ${state.bank ? `<br><span class="hint">Opening bank balance ${money(state.bank)}</span>` : ''}
            </summary>
            <div class="hist-detail">
                ${live.length ? live.map(t => `
                    <div class="hist-row">
                        <span>${esc(t.name)}${t.pur ? ' 🛍️' : ''}<br><span style="font-size:0.75rem;">${fmtDate(t.ts)}${t.kind === 'adjust' ? ' · edit' : ''}</span></span>
                        <span>${t.amt < 0 ? '-' : ''}${money(Math.abs(t.amt))}<button class="rm" data-tx="${t.id}" aria-label="Remove entry">×</button></span>
                    </div>`).join('') : '<div class="empty-note">No entries yet this month.</div>'}
                ${state.tx.length > 60 ? '<div class="hint" style="padding-top:6px;">Showing the latest 60 entries.</div>' : ''}
            </div>
        </details>`;

        // Closed months (read-only)
        if (!past.length) {
            html += '<div class="empty-note">No past months yet. Your first month closes automatically on the 1st.</div>';
        }
        past.forEach(h => {
            const t = totals(h.categories);
            const rows = h.categories.filter(c => c.spent > 0).sort((a, b) => b.spent - a.spent).map(c =>
                `<div class="hist-row"><span class="set-name ${c.spent > c.limit ? 'over' : ''}"><span class="cat-ico">${c.icon}</span>${esc(c.name)}${c.spent > c.limit ? ' ⚠️' : ''}</span><span>${money(c.spent)} / ${money(c.limit)}</span></div>`
            ).join('') || '<div class="empty-note">No spending recorded.</div>';
            const bad = t.spent > h.pool || t.over > 0;
            html += `
            <details class="history-card ${bad ? 'bad' : ''}">
                <summary>
                    <strong>${MONTHS[h.month]} ${h.year}</strong><br>
                    <span class="${t.spent > h.pool ? 'over' : ''}">Spent: ${money(t.spent)} / ${money(h.pool)}</span>${t.over > 0 ? `<br><span class="over" style="font-size:0.85rem;">${money(t.over)} overdrawn</span>` : ''}${h.bank ? `<br><span class="hint">Opening bank balance ${money(h.bank)}</span>` : ''}
                </summary>
                <div class="hist-detail">${rows}</div>
            </details>`;
        });

        el.innerHTML = html;
        const ld = $('live-ledger');
        if (ld) ld.addEventListener('toggle', () => { liveLedgerOpen = ld.open; });
    }

    /* ---------- Tabs ---------- */
    function switchTab(tab) {
        document.querySelectorAll('.nav-item').forEach(el => el.classList.toggle('active', el.dataset.tab === tab));
        $('main-dashboard').style.display = tab === 'main' ? 'block' : 'none';
        $('purch-section').style.display = tab === 'purch' ? 'block' : 'none';
        $('history-section').style.display = tab === 'history' ? 'block' : 'none';
        $('settings-section').style.display = tab === 'settings' ? 'block' : 'none';
        if (tab === 'purch') renderPurchases();
        window.scrollTo(0, 0);
    }

    /* ---------- Events ---------- */
    document.querySelectorAll('.nav-item').forEach(el => el.addEventListener('click', () => switchTab(el.dataset.tab)));
    $('undo-btn').addEventListener('click', undoLast);
    $('pool-label').addEventListener('click', editPool);
    $('purch-chip').addEventListener('click', () => switchTab('purch'));
    $('daily-line').addEventListener('click', () => { lineBump++; renderDashboard(); });
    $('backup-banner').addEventListener('click', e => {
        const b = e.target.closest('[data-b]');
        if (!b) return;
        if (b.dataset.b === 'later') { meta.remindSnooze = Date.now() + 90 * 60000; saveAll(); renderBanner(); }
        else shareBackup();
    });

    $('category-list').addEventListener('click', e => {
        const btn = e.target.closest('.add-btn');
        if (btn) addExpense(Number(btn.dataset.id));
    });

    $('top-dots').addEventListener('click', e => {
        const d = e.target.closest('.fchip');
        if (!d) return;
        const cat = state.categories.find(c => c.id === Number(d.dataset.id));
        if (cat) toast(`${cat.name}: ${money(cat.spent)} of ${money(cat.limit)}`);
    });

    // Hidden affordance: long-press a category to edit its spent total
    let pressTimer = null;
    const list = $('category-list');
    const startPress = e => {
        const info = e.target.closest('.category-item');
        if (!info || e.target.closest('.add-btn')) return;
        clearTimeout(pressTimer);
        pressTimer = setTimeout(() => { vibrate(30); editSpent(Number(info.dataset.id)); }, 600);
    };
    const cancelPress = () => clearTimeout(pressTimer);
    list.addEventListener('touchstart', startPress, { passive: true });
    ['touchend', 'touchmove', 'touchcancel', 'mouseup', 'mouseleave'].forEach(ev => list.addEventListener(ev, cancelPress));
    list.addEventListener('mousedown', startPress);
    list.addEventListener('contextmenu', e => { if (e.target.closest('.category-item')) e.preventDefault(); });

    $('history-section').addEventListener('click', e => {
        const rm = e.target.closest('.rm');
        if (rm) { e.preventDefault(); liveLedgerOpen = true; removeTx(Number(rm.dataset.tx)); }
    });

    $('purch-section').addEventListener('click', e => {
        const rv = e.target.closest('[data-review]');
        if (rv) {
            const p = purch.list.find(x => x.id === Number(rv.dataset.pid));
            if (p) { p.review = rv.dataset.review; saveAll(); renderPurchases(); toast('Noted. Thank you for being honest.'); }
            return;
        }
        const el = e.target.closest('[data-act]');
        if (!el) return;
        const act = el.dataset.act;
        if (act === 'can-buy') canIBuy();
        else if (act === 'purch-cfg') editPurchCfg();
        else if (act === 'edit-cat') editCategory(Number(el.dataset.id));
    });

    $('settings-section').addEventListener('click', e => {
        const el = e.target.closest('[data-act]');
        if (!el) return;
        const act = el.dataset.act;
        if (act === 'edit-pool') editPool();
        else if (act === 'reality') realityCheck();
        else if (act === 'edit-cat') editCategory(Number(el.dataset.id));
        else if (act === 'add-cat') editCategory(null);
        else if (act === 'share') shareBackup();
        else if (act === 'export') exportBackup();
        else if (act === 'import') $('import-file').click();
        else if (act === 'pick-bg') $('bg-file').click();
        else if (act === 'clear-bg') clearBackground();
        else if (act === 'reset-look') { Object.assign(meta, LOOK); saveAll(); applyBackground(); applyGlass(); renderSettings(); toast('Recommended look restored'); }
    });

    $('import-file').addEventListener('change', e => {
        const f = e.target.files && e.target.files[0];
        if (f) importBackup(f);
        e.target.value = '';
    });

    $('bg-file').addEventListener('change', e => {
        const f = e.target.files && e.target.files[0];
        if (f) processWallpaper(f);
        e.target.value = '';
    });
    // Sliders: preview live, save when released
    const SLIDERS = { 'bg-blur': 'bgBlur', 'glass-blur': 'glassBlur' };
    $('settings-section').addEventListener('input', e => {
        const key = SLIDERS[e.target.id];
        if (!key) return;
        meta[key] = Number(e.target.value);
        const lab = $(e.target.id + '-v');
        if (lab) lab.textContent = e.target.value;
        applyBackground();
        applyGlass();
    });
    $('settings-section').addEventListener('change', e => {
        const t = e.target;
        if (SLIDERS[t.id]) { saveAll(); return; }
        if (t.dataset && t.dataset.flag) {
            meta[t.dataset.flag] = t.checked;
            if (t.dataset.flag === 'remindOn' && t.checked) meta.remindSnooze = null;
            saveAll();
            applyNav();
            renderAll();
            if (t.dataset.flag === 'introOn' && t.checked) toast('You will see it next time you open the app');
        } else if (t.dataset && t.dataset.set === 'theme') {
            meta.theme = t.value;
            saveAll();
            applyTheme();
            renderAll();
        } else if (t.dataset && t.dataset.set === 'remindHour') {
            meta.remindHour = Number(t.value);
            meta.remindSnooze = null;
            saveAll();
            renderBanner();
        }
    });

    // Re-check the date, theme and reminder when the app returns to the foreground and every minute while open
    function rolloverCheck() {
        const reset = checkMonthReset();
        rollPool();
        const themed = applyTheme();
        if (reset || themed) renderAll(); else renderBanner();
        promptPoolIfNeeded();
    }
    document.addEventListener('visibilitychange', () => {
        if (document.hidden) { hiddenAt = Date.now(); return; }
        const away = hiddenAt ? Date.now() - hiddenAt : 0;
        rolloverCheck();
        if (away > 15 * 60000) showSplash();
    });
    setInterval(rolloverCheck, 60000);

    // Re-tint colours when the system switches light/dark
    if (window.matchMedia) {
        const mq = window.matchMedia('(prefers-color-scheme: dark)');
        if (mq.addEventListener) mq.addEventListener('change', renderAll);
        else if (mq.addListener) mq.addListener(renderAll);
    }

    /* ---------- Start ---------- */
    function init() {
        const savedState = load('budgetApp_state');
        const savedHistory = load('budgetApp_history');
        const savedMeta = load('budgetApp_meta');

        state = (savedState && Array.isArray(savedState.categories)) ? normState(savedState) : defaultState();
        history = normHistory(savedHistory);
        purch = normPurch(load('budgetApp_purch'));
        rollPool();
        if (savedMeta && typeof savedMeta === 'object') {
            const num = (v, d) => (typeof v === 'number' && isFinite(v) ? v : d);
            const m = META_DEFAULT();
            m.lastBackup = savedMeta.lastBackup || null;
            m.bgBlur = num(savedMeta.bgBlur, m.bgBlur);
            m.glassBlur = num(savedMeta.glassBlur, m.glassBlur);
            Object.keys(FLAGS).forEach(k => { if (typeof savedMeta[k] === 'boolean') m[k] = savedMeta[k]; });
            if (savedMeta.theme === 'auto' || THEMES[savedMeta.theme]) m.theme = savedMeta.theme;
            if ([21, 22, 23].indexOf(savedMeta.remindHour) >= 0) m.remindHour = savedMeta.remindHour;
            m.remindSnooze = num(savedMeta.remindSnooze, null);
            m.catsV2 = !!savedMeta.catsV2;
            meta = m;
        }

        // One-time: add the Grooming, Fragrances and Clothes categories to an existing setup
        if (!meta.catsV2) {
            NEW_CATS_V2.forEach(name => {
                if (state.categories.some(c => c.name.toLowerCase() === name.toLowerCase())) return;
                const d = defaultCategories.find(c => c.name === name);
                state.categories.push(normCat({ ...d, id: state.nextId++, spent: 0, count: 0 }));
            });
            meta.catsV2 = true;
        }

        state.categories.forEach(c => catBucket(c.id));
        checkMonthReset();
        applyTheme();
        saveAll();
        applyBackground();
        applyGlass();
        applyNav();
        renderAll();
        showSplash();
        promptPoolIfNeeded();

        // Ask the browser to keep this app's data safe from automatic clearing
        if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
    }
    init();
})();
</script>
<script>
// Offline support: only registers when served over http(s), which installing as an app needs
if ('serviceWorker' in navigator && location.protocol.indexOf('http') === 0) {
    window.addEventListener('load', function () {
        navigator.serviceWorker.register('sw.js').catch(function () {});
    });
}
</script>
</body>
